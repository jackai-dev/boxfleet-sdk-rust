[package]
name = "boxfleet_sdk"
version = "0.3.0"
edition = "2021"
repository = "https://github.com/jackai-dev/boxfleet-sdk-rust"
rust-version = "1.86"
description = "Official OpenAPI 3.1 specification for **BoxFleet** (`boxfleet` / `boxfleek` / `jackai-box`), generated and verified with **OmniWrap** for the `jackai-dev` ecosystem."
license-file = "LICENSE"

include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "api.md", "LICENSE", "omniwrap-artifact.json"]

[package.metadata.omniwrap]
schema = "https://omniwrap.dev/schemas/rust-package/v2"
source_version_present = true
source_version_utf8_hex = "302e332e30"

[dependencies]
base64 = "0.22.1"
futures-core = "0.3.32"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "time"] }
urlencoding = "2.1.3"
